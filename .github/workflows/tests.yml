name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    env:
      SCHEDULE_NOTIFICATION_LANGUAGE_POLICY: ${{ github.workspace }}/notification-policy/claude/scripts/notification_language.py
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: schedule-reminder
          submodules: true
          persist-credentials: false

      - name: Require private dependency access
        env:
          LLMCALL_READ_KEY: ${{ secrets.LLMCALL_READ_KEY }}
          POLICY_READ_KEY: ${{ secrets.NOTIFICATION_POLICY_READ_KEY }}
          POLICY_REPOSITORY: ${{ secrets.NOTIFICATION_POLICY_REPOSITORY }}
        run: |
          test -n "$LLMCALL_READ_KEY" || { echo "::error::LLMCALL_READ_KEY is required to test the real dependency"; exit 1; }
          test -n "$POLICY_READ_KEY" || { echo "::error::NOTIFICATION_POLICY_READ_KEY is required to test the maintained language policy"; exit 1; }
          test -n "$POLICY_REPOSITORY" || { echo "::error::NOTIFICATION_POLICY_REPOSITORY is required"; exit 1; }

      - uses: actions/checkout@v4
        with:
          repository: DaizeDong/llmcall
          ref: 39dd746958cc2443ed1878af9758569c136b5bea
          path: llmcall
          ssh-key: ${{ secrets.LLMCALL_READ_KEY }}
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.NOTIFICATION_POLICY_REPOSITORY }}
          ref: 63993685e07e6d91030fb112605808e9ec897648
          path: notification-policy
          ssh-key: ${{ secrets.NOTIFICATION_POLICY_READ_KEY }}
          persist-credentials: false
          sparse-checkout: claude/scripts/notification_language.py
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v4
        with:
          repository: DaizeDong/task-console
          ref: 8a65eb539c61eccac5859da34dbaa20a4989369f
          path: task-console
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install real shared dependencies
        run: |
          python -m pip install --quiet "git+https://github.com/DaizeDong/fleet-guards.git@3ad9b0ed38437ae4194eef9b462f53807d8124b7" ./llmcall ./task-console -r schedule-reminder/requirements.txt pytest
          python -m pip check
          python -c "from llmcall import ExecutionRequirements; from fleet_guards import datadir, filesystem"
          test -f "$SCHEDULE_NOTIFICATION_LANGUAGE_POLICY"

      - name: Acceptance suite
        working-directory: schedule-reminder
        run: |
          test -d skills/schedule-reminder/tests || { echo "::error::the test suite is missing"; exit 1; }
          python -B -m pytest skills/schedule-reminder/tests/ -q -p no:cacheprovider --junitxml=../test-results.xml

      - name: The suite must not have evaporated
        working-directory: schedule-reminder
        run: |
          n=$(python -B -m pytest skills/schedule-reminder/tests/ -q -p no:cacheprovider --collect-only | grep -c '::')
          echo "collected $n tests"
          test "$n" -ge 422 || { echo "::error::only $n tests collected, expected at least 422"; exit 1; }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results
          path: test-results.xml
          if-no-files-found: error
